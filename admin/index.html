<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Berat Elektrik – Admin Panel</title>
  <meta name="robots" content="noindex, nofollow" />

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cyan: #00E5FF; --black: #090e1a; --dark: #0c1220;
      --card: #111827; --border: #1e2d42; --text: #ffffff;
      --muted: #6b7fa0; --green: #22c55e; --red: #ef4444;
    }
    body { background: var(--black); color: var(--text); font-family: system-ui, sans-serif; min-height: 100vh; }

    /* ── LOGIN ── */
    #loginScreen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .login-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 40px; width: 100%; max-width: 380px; }
    .login-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .login-logo svg { width: 36px; height: 36px; }
    .login-logo-text { font-size: 1.1rem; font-weight: 700; letter-spacing: 3px; color: var(--cyan); }
    .login-sub { font-size: 0.78rem; color: var(--muted); margin-bottom: 28px; letter-spacing: 1px; }
    .err-msg { color: var(--red); font-size: 0.82rem; margin-bottom: 10px; display: none; padding: 8px 12px; background: rgba(239,68,68,.1); border-radius: 6px; border: 1px solid rgba(239,68,68,.2); }
    .field-label { font-size: 0.72rem; color: var(--muted); letter-spacing: 1px; margin-bottom: 6px; display: block; }
    .field-input { width: 100%; background: var(--dark); border: 1px solid var(--border); color: var(--text); padding: 12px 16px; border-radius: 10px; font-size: 0.95rem; outline: none; margin-bottom: 14px; }
    .field-input:focus { border-color: var(--cyan); }
    .btn-primary { width: 100%; background: var(--cyan); color: #000; border: none; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; letter-spacing: 1px; }
    .btn-primary:hover { opacity: .85; }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }

    /* ── ADMIN LAYOUT ── */
    #adminScreen { display: none; }
    .admin-header {
      background: var(--dark); border-bottom: 1px solid var(--border);
      padding: 14px 24px; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .admin-logo { display: flex; align-items: center; gap: 10px; }
    .admin-logo svg { width: 26px; height: 26px; }
    .admin-logo-text { font-weight: 700; letter-spacing: 2px; color: var(--cyan); }
    .admin-badge { background: rgba(0,229,255,.1); border: 1px solid rgba(0,229,255,.2); color: var(--cyan); font-size: 0.7rem; padding: 3px 8px; border-radius: 20px; letter-spacing: 1px; margin-left: 8px; }
    .btn-logout { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3); color: var(--red); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; }

    .admin-body { display: flex; min-height: calc(100vh - 65px); }

    /* ── SIDEBAR ── */
    .sidebar { width: 210px; background: var(--dark); border-right: 1px solid var(--border); padding: 20px 0; flex-shrink: 0; }
    .sidebar-label { font-size: 0.65rem; color: var(--muted); letter-spacing: 2px; padding: 0 18px; margin: 16px 0 6px; }
    .sidebar-link { display: flex; align-items: center; gap: 10px; padding: 10px 18px; color: var(--muted); cursor: pointer; border-left: 3px solid transparent; transition: all .2s; font-size: 0.875rem; }
    .sidebar-link:hover { color: var(--text); background: rgba(255,255,255,.03); }
    .sidebar-link.active { color: var(--cyan); border-left-color: var(--cyan); background: rgba(0,229,255,.05); }

    /* ── MAIN ── */
    .admin-main { flex: 1; padding: 28px; overflow-y: auto; max-width: 100%; }
    .section-panel { display: none; }
    .section-panel.active { display: block; }
    .panel-title { font-size: 1.1rem; font-weight: 700; letter-spacing: 3px; color: var(--cyan); margin-bottom: 24px; }

    /* ── FORMS ── */
    .form-group { margin-bottom: 16px; }
    .form-label { font-size: 0.72rem; color: var(--muted); letter-spacing: 1px; margin-bottom: 6px; display: block; }
    .form-input, .form-textarea { width: 100%; background: var(--dark); border: 1px solid var(--border); color: var(--text); padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; outline: none; font-family: inherit; }
    .form-input:focus, .form-textarea:focus { border-color: var(--cyan); }
    .form-textarea { resize: vertical; min-height: 75px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    /* ── CARDS ── */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
    .edit-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .edit-card-header { padding: 10px 16px; background: rgba(0,229,255,.05); border-bottom: 1px solid var(--border); font-size: 0.72rem; color: var(--cyan); letter-spacing: 2px; font-weight: 700; }
    .edit-card-body { padding: 14px; }
    .img-preview { width: 100%; height: 130px; object-fit: cover; border-radius: 6px; margin-bottom: 10px; background: var(--dark); border: 1px solid var(--border); }
    .review-card-edit, .faq-card-edit { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
    .sub-title { font-size: 0.72rem; color: var(--cyan); letter-spacing: 2px; font-weight: 700; margin-bottom: 12px; }

    /* ── SAVE BAR ── */
    .save-bar { position: sticky; bottom: 0; background: var(--dark); border-top: 1px solid var(--border); padding: 14px 28px; display: flex; align-items: center; gap: 14px; }
    .btn-save { background: var(--cyan); color: #000; border: none; padding: 11px 28px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer; letter-spacing: 1px; }
    .btn-save:hover { opacity: .85; }
    .btn-save:disabled { opacity: .5; cursor: not-allowed; }
    .save-status { font-size: 0.85rem; }
    .save-status.success { color: var(--green); }
    .save-status.error { color: var(--red); }
    .save-status.loading { color: var(--muted); }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .form-row { grid-template-columns: 1fr; }
      .admin-main { padding: 16px; }
    }
  </style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">
      <svg viewBox="0 0 32 32" fill="none">
        <rect width="32" height="32" rx="6" fill="#090e1a"/>
        <polygon points="18,3 8,18 15,18 14,29 24,14 17,14" fill="#00E5FF"/>
      </svg>
      <span class="login-logo-text">BERAT ELEKTRİK</span>
    </div>
    <div class="login-sub">YÖNETİM PANELİ</div>
    <div class="err-msg" id="errMsg">Şifre hatalı, tekrar dene.</div>
    <label class="field-label">ŞİFRE</label>
    <input type="password" class="field-input" id="loginPass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()" />
    <button class="btn-primary" id="loginBtn" onclick="doLogin()">GİRİŞ YAP</button>
  </div>
</div>

<!-- ── ADMIN ── -->
<div id="adminScreen">
  <div class="admin-header">
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="admin-logo">
        <svg viewBox="0 0 32 32" fill="none">
          <rect width="32" height="32" rx="6" fill="#090e1a"/>
          <polygon points="18,3 8,18 15,18 14,29 24,14 17,14" fill="#00E5FF"/>
        </svg>
        <span class="admin-logo-text">BERAT ELEKTRİK</span>
      </div>
      <span class="admin-badge">ADMİN</span>
    </div>
    <button class="btn-logout" onclick="doLogout()">Çıkış Yap</button>
  </div>

  <div class="admin-body">
    <nav class="sidebar">
      <div class="sidebar-label">BÖLÜMLER</div>
      <div class="sidebar-link active" onclick="showPanel('galeri',this)">🖼️ &nbsp;Galeri</div>
      <div class="sidebar-link" onclick="showPanel('hizmetler',this)">⚡ &nbsp;Hizmetler</div>
      <div class="sidebar-link" onclick="showPanel('yorumlar',this)">⭐ &nbsp;Müşteri Yorumları</div>
      <div class="sidebar-link" onclick="showPanel('hakkimizda',this)">ℹ️ &nbsp;Hakkımızda</div>
      <div class="sidebar-link" onclick="showPanel('sss',this)">❓ &nbsp;SSS</div>
      <div class="sidebar-label">DİĞER</div>
      <div class="sidebar-link" onclick="showPanel('iletisim',this)">📞 &nbsp;İletişim</div>
    </nav>

    <div class="admin-main">

      <div class="section-panel active" id="panel-galeri">
        <div class="panel-title">🖼️ GALERİ</div>
        <div class="cards-grid" id="galleryCards"></div>
      </div>

      <div class="section-panel" id="panel-hizmetler">
        <div class="panel-title">⚡ HİZMETLER</div>
        <div id="serviceCards"></div>
      </div>

      <div class="section-panel" id="panel-yorumlar">
        <div class="panel-title">⭐ MÜŞTERİ YORUMLARI</div>
        <div id="reviewCards"></div>
      </div>

      <div class="section-panel" id="panel-hakkimizda">
        <div class="panel-title">ℹ️ HAKKIMIZDA</div>
        <div class="form-group">
          <label class="form-label">AÇIKLAMA METNİ</label>
          <textarea class="form-textarea" id="aboutText" rows="5"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">YIL DENEYİM</label>
            <input type="text" class="form-input" id="aboutYears" />
          </div>
          <div class="form-group">
            <label class="form-label">TAMAMLANAN İŞ</label>
            <input type="text" class="form-input" id="aboutJobs" />
          </div>
        </div>
      </div>

      <div class="section-panel" id="panel-sss">
        <div class="panel-title">❓ SIK SORULAN SORULAR</div>
        <div id="faqCards"></div>
      </div>

      <div class="section-panel" id="panel-iletisim">
        <div class="panel-title">📞 İLETİŞİM</div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">TELEFON 1</label>
            <input type="text" class="form-input" id="phone1" />
          </div>
          <div class="form-group">
            <label class="form-label">TELEFON 2</label>
            <input type="text" class="form-input" id="phone2" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">WHATSAPP (başında 90 ile, boşluksuz)</label>
          <input type="text" class="form-input" id="whatsapp" />
        </div>
      </div>

    </div>
  </div>

  <div class="save-bar">
    <button class="btn-save" id="saveBtn" onclick="saveContent()">💾 KAYDET &amp; YAYINLA</button>
    <span class="save-status" id="saveStatus"></span>
  </div>
</div>

<script>
  /* ─────────────────────────────────────────
     FIREBASE CONFIG — buraya yapıştır
  ───────────────────────────────────────── */
  const firebaseConfig = {
    apiKey:            "BURAYA_API_KEY",
    authDomain:        "BURAYA_AUTH_DOMAIN",
    projectId:         "BURAYA_PROJECT_ID",
    storageBucket:     "BURAYA_STORAGE_BUCKET",
    messagingSenderId: "BURAYA_SENDER_ID",
    appId:             "BURAYA_APP_ID"
  };

  /* Admin e-postası — Firebase Auth'ta oluşturacağın hesap */
  const ADMIN_EMAIL = 'admin@beratelektrik06.com.tr';
  /* ───────────────────────────────────────── */

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db   = firebase.firestore();

  let content = {};

  /* ── GİRİŞ ── */
  async function doLogin() {
    const pass = document.getElementById('loginPass').value;
    const btn  = document.getElementById('loginBtn');
    const err  = document.getElementById('errMsg');
    err.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Giriş yapılıyor...';
    try {
      await auth.signInWithEmailAndPassword(ADMIN_EMAIL, pass);
    } catch (e) {
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'GİRİŞ YAP';
    }
  }

  /* ── ÇIKIŞ ── */
  async function doLogout() {
    await auth.signOut();
  }

  /* ── AUTH STATE ── */
  auth.onAuthStateChanged(async user => {
    if (user) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('adminScreen').style.display = 'block';
      await loadContent();
    } else {
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('adminScreen').style.display = 'none';
      document.getElementById('loginBtn').disabled = false;
      document.getElementById('loginBtn').textContent = 'GİRİŞ YAP';
    }
  });

  /* ── İÇERİK YÜKLEMİ ── */
  async function loadContent() {
    const snap = await db.collection('site').doc('content').get();
    if (snap.exists) {
      content = snap.data();
    } else {
      /* İlk kurulum — varsayılan içerik yükle */
      const res = await fetch('../content.json');
      content = await res.json();
      await db.collection('site').doc('content').set(content);
    }
    renderAll();
  }

  /* ── KAYDET ── */
  async function saveContent() {
    const btn    = document.getElementById('saveBtn');
    const status = document.getElementById('saveStatus');
    btn.disabled = true;
    status.className = 'save-status loading';
    status.textContent = 'Kaydediliyor...';
    try {
      const newContent = collectContent();
      await db.collection('site').doc('content').set(newContent);
      content = newContent;
      status.className = 'save-status success';
      status.textContent = '✅ Kaydedildi! Site anında güncellendi.';
    } catch (e) {
      status.className = 'save-status error';
      status.textContent = '❌ Hata: ' + e.message;
    }
    btn.disabled = false;
  }

  /* ── RENDER ── */
  function renderAll() {
    renderGallery();
    renderServices();
    renderReviews();
    renderAbout();
    renderFaq();
    renderContact();
  }

  function renderGallery() {
    document.getElementById('galleryCards').innerHTML = content.gallery.map((item, i) => `
      <div class="edit-card">
        <div class="edit-card-header">GALERİ ${i + 1}</div>
        <div class="edit-card-body">
          <img class="img-preview" id="gprev-${i}" src="${item.img}" onerror="this.src=''" />
          <div class="form-group">
            <label class="form-label">GÖRSEL URL</label>
            <input type="text" class="form-input" id="gimg-${i}" value="${item.img}" oninput="document.getElementById('gprev-${i}').src=this.value" />
          </div>
          <div class="form-group">
            <label class="form-label">BAŞLIK</label>
            <input type="text" class="form-input" id="gtitle-${i}" value="${item.title}" />
          </div>
          <div class="form-group">
            <label class="form-label">AÇIKLAMA</label>
            <input type="text" class="form-input" id="gdesc-${i}" value="${item.desc}" />
          </div>
          <div class="form-group">
            <label class="form-label">ETİKET</label>
            <input type="text" class="form-input" id="gtag-${i}" value="${item.tag}" />
          </div>
        </div>
      </div>`).join('');
  }

  function renderServices() {
    document.getElementById('serviceCards').innerHTML = content.services.map((item, i) => `
      <div class="review-card-edit">
        <div class="sub-title">HİZMET ${i + 1}</div>
        <div class="form-group">
          <label class="form-label">HİZMET ADI</label>
          <input type="text" class="form-input" id="sname-${i}" value="${item.name}" />
        </div>
      </div>`).join('');
  }

  function renderReviews() {
    document.getElementById('reviewCards').innerHTML = content.reviews.map((item, i) => `
      <div class="review-card-edit">
        <div class="sub-title">YORUM ${i + 1}</div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">AD SOYAD</label>
            <input type="text" class="form-input" id="rname-${i}" value="${item.name}" />
          </div>
          <div class="form-group">
            <label class="form-label">TARİH</label>
            <input type="text" class="form-input" id="rdate-${i}" value="${item.date}" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">YORUM METNİ</label>
          <textarea class="form-textarea" id="rtext-${i}">${item.text}</textarea>
        </div>
      </div>`).join('');
  }

  function renderAbout() {
    document.getElementById('aboutText').value  = content.about.text;
    document.getElementById('aboutYears').value = content.about.years;
    document.getElementById('aboutJobs').value  = content.about.jobs;
  }

  function renderFaq() {
    document.getElementById('faqCards').innerHTML = content.faq.map((item, i) => `
      <div class="faq-card-edit">
        <div class="sub-title">SORU ${i + 1}</div>
        <div class="form-group">
          <label class="form-label">SORU</label>
          <input type="text" class="form-input" id="fq-${i}" value="${item.q.replace(/"/g,'&quot;')}" />
        </div>
        <div class="form-group">
          <label class="form-label">CEVAP</label>
          <textarea class="form-textarea" id="fa-${i}">${item.a}</textarea>
        </div>
      </div>`).join('');
  }

  function renderContact() {
    document.getElementById('phone1').value    = content.phone1;
    document.getElementById('phone2').value    = content.phone2;
    document.getElementById('whatsapp').value  = content.whatsapp;
  }

  /* ── COLLECT ── */
  function collectContent() {
    return {
      phone1:    document.getElementById('phone1').value,
      phone2:    document.getElementById('phone2').value,
      whatsapp:  document.getElementById('whatsapp').value,
      hero:      content.hero,
      services:  content.services.map((_, i) => ({ name: document.getElementById(`sname-${i}`).value })),
      gallery:   content.gallery.map((_, i) => ({
        img:   document.getElementById(`gimg-${i}`).value,
        title: document.getElementById(`gtitle-${i}`).value,
        desc:  document.getElementById(`gdesc-${i}`).value,
        tag:   document.getElementById(`gtag-${i}`).value,
      })),
      reviews: content.reviews.map((item, i) => ({
        name:    document.getElementById(`rname-${i}`).value,
        initial: document.getElementById(`rname-${i}`).value.charAt(0).toUpperCase(),
        color:   item.color,
        date:    document.getElementById(`rdate-${i}`).value,
        text:    document.getElementById(`rtext-${i}`).value,
      })),
      about: {
        text:  document.getElementById('aboutText').value,
        years: document.getElementById('aboutYears').value,
        jobs:  document.getElementById('aboutJobs').value,
      },
      faq: content.faq.map((_, i) => ({
        q: document.getElementById(`fq-${i}`).value,
        a: document.getElementById(`fa-${i}`).value,
      }))
    };
  }

  function showPanel(id, el) {
    document.querySelectorAll('.section-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
    document.getElementById('panel-' + id).classList.add('active');
    el.classList.add('active');
  }
</script>
</body>
</html>
