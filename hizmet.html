<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hizmet Detayı – Berat Elektrik</title>
  <meta name="description" id="metaDesc" content="Berat Elektrik hizmet detayı ve çalışma görselleri. Ankara'da 7/24 elektrik hizmetleri, kamera kurulumu, avize montajı, elektrik arıza." />
  <meta name="robots" content="index, follow" />
  <meta name="author" content="Berat Elektrik" />
  <link rel="canonical" id="canonicalLink" href="https://beratelektrik06.com.tr/hizmet.html" />

  <!-- Open Graph -->
  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="Berat Elektrik" />
  <meta property="og:locale" content="tr_TR" />
  <meta property="og:title" id="ogTitle" content="Berat Elektrik – Hizmet Detayı" />
  <meta property="og:description" id="ogDesc" content="Ankara'da 7/24 elektrik hizmetleri." />
  <meta property="og:url" id="ogUrl" content="https://beratelektrik06.com.tr/hizmet.html" />
  <meta property="og:image" id="ogImage" content="https://images.unsplash.com/photo-1566417110090-6b15a06ec800?w=1200&q=80" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cyan: #00E5FF; --cyan2: #00CCEE; --cyan3: #0099BB;
      --blue: #4477FF; --purple: #9944FF;
      --black: #090e1a; --dark: #0c1220; --card: #111827; --card2: #141d2b;
      --border: #1e2d42; --text: #ffffff; --muted: #6b7fa0; --green: #25D366;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--black); color: var(--text); font-family: 'Rajdhani', sans-serif; min-height: 100vh; overflow-x: hidden; }

    /* HEADER */
    .det-header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(9,14,26,.94); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
    }
    .det-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .det-logo svg { width: 30px; height: 30px; }
    .det-logo-text { font-family: 'Oswald',sans-serif; font-weight: 700; letter-spacing: 2px; color: var(--cyan); font-size: 1rem; }
    .det-back {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(0,229,255,.08); border: 1px solid rgba(0,229,255,.25);
      color: var(--cyan); padding: 8px 16px; border-radius: 50px;
      text-decoration: none; font-family: 'Oswald',sans-serif; font-size: .78rem; font-weight: 600; letter-spacing: 1px;
    }
    .det-back:hover { background: rgba(0,229,255,.16); }

    /* HERO */
    .det-hero { max-width: 1000px; margin: 0 auto; padding: 40px 20px 20px; }
    .det-tag {
      display: inline-block; background: rgba(0,229,255,.1); border: 1px solid rgba(0,229,255,.3);
      color: var(--cyan); font-family: 'Oswald',sans-serif; font-size: .72rem; font-weight: 700;
      letter-spacing: 2px; padding: 5px 14px; border-radius: 50px; margin-bottom: 16px;
    }
    .det-title { font-family: 'Bebas Neue',sans-serif; font-size: 2.8rem; line-height: 1; letter-spacing: 2px; margin-bottom: 12px; }
    .det-desc { font-size: 1.05rem; color: var(--muted); font-weight: 500; line-height: 1.6; max-width: 720px; }
    .det-detail { font-size: 1rem; color: #b8c5da; font-weight: 400; line-height: 1.8; max-width: 760px; margin-top: 18px; white-space: pre-wrap; }

    /* GALLERY GRID */
    .det-gallery { max-width: 1000px; margin: 0 auto; padding: 24px 20px 60px; }
    .det-gallery-title {
      font-family: 'Oswald',sans-serif; font-size: 1rem; font-weight: 700; letter-spacing: 3px;
      color: var(--cyan); margin-bottom: 20px; display: flex; align-items: center; gap: 12px;
    }
    .det-gallery-title::after { content: ''; flex: 1; height: 1.5px; background: linear-gradient(90deg, var(--cyan3), transparent); }
    .det-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .det-img-wrap {
      position: relative; border-radius: 12px; overflow: hidden; cursor: pointer;
      border: 1px solid var(--border); background: var(--card); aspect-ratio: 4/3;
    }
    .det-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform .35s, filter .35s; filter: brightness(.9); }
    .det-img-wrap:hover img { transform: scale(1.06); filter: brightness(1); }
    .det-empty { text-align: center; color: var(--muted); padding: 40px; font-size: .95rem; }

    /* LIGHTBOX */
    .lightbox {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,.92); align-items: center; justify-content: center; padding: 20px;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 95%; max-height: 88%; border-radius: 8px; }
    .lightbox-close { position: absolute; top: 20px; right: 24px; color: #fff; font-size: 2rem; cursor: pointer; line-height: 1; background: none; border: none; }
    .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,229,255,.15); border: 1px solid rgba(0,229,255,.3); color: var(--cyan); width: 48px; height: 48px; border-radius: 50%; font-size: 1.5rem; cursor: pointer; }
    .lb-prev { left: 16px; } .lb-next { right: 16px; }

    /* CTA */
    .det-cta { max-width: 1000px; margin: 0 auto 60px; padding: 0 20px; }
    .det-cta-box {
      background: linear-gradient(135deg, var(--card), #0a1420); border: 1px solid var(--border);
      border-radius: 16px; padding: 28px; text-align: center;
    }
    .det-cta-box h3 { font-family: 'Bebas Neue',sans-serif; font-size: 1.6rem; letter-spacing: 2px; margin-bottom: 6px; }
    .det-cta-box p { color: var(--muted); font-size: .9rem; margin-bottom: 18px; }
    .det-cta-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .det-btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 12px 26px; border-radius: 50px;
      text-decoration: none; font-family: 'Oswald',sans-serif; font-size: .85rem; font-weight: 700; letter-spacing: 1px;
    }
    .det-btn-call { background: var(--cyan); color: #000; }
    .det-btn-wa { background: var(--green); color: #fff; }

    .det-footer { border-top: 1px solid var(--border); padding: 24px 20px; text-align: center; color: var(--muted); font-size: .8rem; }

    /* FLOAT WA */
    .float-wa { position: fixed; bottom: 20px; right: 20px; z-index: 90; width: 54px; height: 54px; background: var(--green); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(37,211,102,.4); }
    .float-wa svg { width: 30px; height: 30px; }

    @media (min-width: 768px) {
      .det-header { padding: 16px 40px; }
      .det-title { font-size: 3.6rem; }
      .det-hero { padding-top: 56px; }
    }
    @media (max-width: 500px) {
      .det-title { font-size: 2.2rem; }
      .det-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    }
  </style>
</head>
<body>

<header class="det-header">
  <a href="index.html" class="det-logo">
    <svg viewBox="0 0 32 32" fill="none">
      <rect width="32" height="32" rx="6" fill="#090e1a"/>
      <polygon points="18,3 8,18 15,18 14,29 24,14 17,14" fill="#00E5FF"/>
    </svg>
    <span class="det-logo-text">BERAT ELEKTRİK</span>
  </a>
  <a href="index.html#galeri" class="det-back">‹ Galeriye Dön</a>
</header>

<section class="det-hero">
  <span class="det-tag" id="detTag">HİZMET</span>
  <h1 class="det-title" id="detTitle">Yükleniyor…</h1>
  <p class="det-desc" id="detDesc"></p>
  <div class="det-detail" id="detDetail"></div>
</section>

<section class="det-gallery">
  <div class="det-gallery-title">ÇALIŞMA GÖRSELLERİ</div>
  <div class="det-grid" id="detGrid"></div>
  <div class="det-empty" id="detEmpty" style="display:none;">Bu hizmet için henüz görsel eklenmemiş.</div>
</section>

<section class="det-cta">
  <div class="det-cta-box">
    <h3>BU HİZMET İÇİN TEKLİF ALIN</h3>
    <p>7/24 ulaşabilirsiniz — hızlı ve güvenilir hizmet.</p>
    <div class="det-cta-btns">
      <a href="tel:05059770648" class="det-btn det-btn-call" id="detCall">📞 HEMEN ARA</a>
      <a href="https://wa.me/905059770648" target="_blank" rel="noopener" class="det-btn det-btn-wa" id="detWa">WHATSAPP</a>
    </div>
  </div>
</section>

<footer class="det-footer">© 2025 Berat Elektrik · Tüm hakları saklıdır.</footer>

<a href="https://wa.me/905059770648" target="_blank" rel="noopener" class="float-wa" id="detFloatWa" aria-label="WhatsApp">
  <svg viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
</a>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLb()">×</button>
  <button class="lightbox-nav lb-prev" onclick="navLb(-1)">‹</button>
  <img id="lbImg" src="" alt="" />
  <button class="lightbox-nav lb-next" onclick="navLb(1)">›</button>
</div>

<script>
  const firebaseConfig = {
    apiKey:            "AIzaSyD9bDSFD3g0c7HFSAdehFmLuVzPI3vHz5o",
    authDomain:        "berat-elektirik.firebaseapp.com",
    projectId:         "berat-elektirik",
    storageBucket:     "berat-elektirik.firebasestorage.app",
    messagingSenderId: "84732663158",
    appId:             "1:84732663158:web:6a6bf0c39450aae7b8d657"
  };

  const params = new URLSearchParams(location.search);
  const id = parseInt(params.get('id'), 10);
  let images = [];
  let lbIndex = 0;

  if (isNaN(id)) {
    location.href = 'index.html';
  }

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  Promise.all([
    db.collection('site').doc('content').get(),
    db.collection('gallery').doc(String(id)).get().catch(() => null)
  ]).then(([csnap, gsnap]) => {
    if (!csnap.exists) { document.getElementById('detTitle').textContent = 'İçerik bulunamadı'; return; }
    const c = csnap.data();
    const item = c.gallery && c.gallery[id];
    if (!item) { document.getElementById('detTitle').textContent = 'Hizmet bulunamadı'; return; }

    document.title = item.title + ' – Berat Elektrik Ankara';
    document.getElementById('detTag').textContent = item.tag || 'HİZMET';
    document.getElementById('detTitle').textContent = item.title || '';
    document.getElementById('detDesc').textContent = item.desc || '';
    document.getElementById('detDetail').textContent = item.detail || '';

    /* ── Dinamik SEO ── */
    const pageUrl = 'https://beratelektrik06.com.tr/hizmet.html?id=' + id;
    const metaText = (item.detail && item.detail.trim())
      ? item.detail.trim().slice(0, 155)
      : (item.title + ' – ' + (item.desc || '') + ' Berat Elektrik Ankara, 7/24 hizmet.').slice(0, 155);
    const setMeta = (elId, val) => { const el = document.getElementById(elId); if (el) el.setAttribute(el.tagName === 'LINK' ? 'href' : 'content', val); };
    setMeta('metaDesc', metaText);
    setMeta('canonicalLink', pageUrl);
    setMeta('ogTitle', item.title + ' – Berat Elektrik');
    setMeta('ogDesc', metaText);
    setMeta('ogUrl', pageUrl);

    /* Schema.org: Service + Breadcrumb */
    const ld = {
      "@context": "https://schema.org",
      "@type": "Service",
      "name": item.title,
      "serviceType": item.title,
      "description": metaText,
      "areaServed": { "@type": "City", "name": "Ankara" },
      "provider": {
        "@type": "Electrician",
        "name": "Berat Elektrik",
        "telephone": c.phone1 ? "+9" + c.phone1.replace(/\D/g,'') : "+905059770648",
        "url": "https://beratelektrik06.com.tr/",
        "areaServed": "Ankara"
      },
      "url": pageUrl
    };
    const bc = {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Ana Sayfa", "item": "https://beratelektrik06.com.tr/" },
        { "@type": "ListItem", "position": 2, "name": item.title, "item": pageUrl }
      ]
    };
    [ld, bc].forEach(obj => {
      const s = document.createElement('script');
      s.type = 'application/ld+json';
      s.textContent = JSON.stringify(obj);
      document.head.appendChild(s);
    });

    /* İletişim numaraları */
    if (c.phone1) {
      document.getElementById('detCall').href = 'tel:' + c.phone1.replace(/\s/g,'');
      document.getElementById('detCall').textContent = '📞 ' + c.phone1;
    }
    if (c.whatsapp) {
      document.getElementById('detWa').href = 'https://wa.me/' + c.whatsapp;
      document.getElementById('detFloatWa').href = 'https://wa.me/' + c.whatsapp;
    }

    /* Görseller: yeni yapı gallery/{id}.images, yoksa eski tek görsel */
    images = (gsnap && gsnap.exists && gsnap.data().images) ? gsnap.data().images : (item.img ? [item.img] : []);
    /* og:image sadece http(s) kapak varsa (base64 sosyal paylaşımda çalışmaz) */
    if (images[0] && /^https?:/.test(images[0])) {
      const oi = document.getElementById('ogImage'); if (oi) oi.setAttribute('content', images[0]);
    }
    renderImages();
  }).catch(e => {
    document.getElementById('detTitle').textContent = 'Bir hata oluştu';
  });

  function renderImages() {
    const grid = document.getElementById('detGrid');
    if (!images.length) {
      document.getElementById('detEmpty').style.display = 'block';
      return;
    }
    grid.innerHTML = images.map((src, i) => `
      <div class="det-img-wrap" onclick="openLb(${i})">
        <img src="${src}" alt="Görsel ${i+1}" loading="lazy" />
      </div>`).join('');
  }

  function openLb(i) {
    lbIndex = i;
    document.getElementById('lbImg').src = images[i];
    document.getElementById('lightbox').classList.add('open');
  }
  function closeLb() { document.getElementById('lightbox').classList.remove('open'); }
  function navLb(dir) {
    lbIndex = (lbIndex + dir + images.length) % images.length;
    document.getElementById('lbImg').src = images[lbIndex];
  }
  document.getElementById('lightbox').addEventListener('click', e => {
    if (e.target.id === 'lightbox') closeLb();
  });
  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'Escape') closeLb();
    if (e.key === 'ArrowLeft') navLb(-1);
    if (e.key === 'ArrowRight') navLb(1);
  });
</script>
</body>
</html>
